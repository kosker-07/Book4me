name: BED4BOOK New Web UI
on:
  push:
    branches: [feature/yeni-arayuz]
    paths:
      - 'web/**'
      - '.github/workflows/bed4book-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/bed4book-web.yml'
jobs:
  web-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
  browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
