name: BED4BOOK v1 server checks

on:
  workflow_dispatch:
    inputs:
      ui_ref:
        description: "Branch with the web/ UI for the five-user end-to-end test"
        default: feature/yeni-arayuz
  push:
    branches:
      - main
      - feature/bed4book-v1-server-foundation
      - "claude/**"
    paths:
      - "server/**"
      - "tests/server/**"
      - "tests/e2e/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.server.json"
      - "infra/**"
      - ".github/workflows/bed4book-v1-server.yml"
  pull_request:
    paths:
      - "server/**"
      - "tests/server/**"
      - "tests/e2e/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.server.json"
      - "infra/**"
      - ".github/workflows/bed4book-v1-server.yml"

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bed4book
          POSTGRES_PASSWORD: bed4book
          POSTGRES_DB: bed4book_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bed4book -d bed4book_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bed4book:bed4book@localhost:5432/bed4book_test
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pdftotext (voucher content verification)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Apply migrations to a clean database
        run: |
          for f in server/migrations/*.sql; do
            echo "Applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Re-apply migrations after 001 (must be idempotent)
        run: |
          for f in server/migrations/*.sql; do
            [ "$(basename "$f")" = "001_initial.sql" ] && continue
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Upgrade a database that has only 001 and legacy data
        run: |
          BASE="postgres://bed4book:bed4book@localhost:5432"
          psql "$BASE/bed4book_test" -c "CREATE DATABASE bed4book_upgrade"
          psql "$BASE/bed4book_upgrade" -v ON_ERROR_STOP=1 -q -f server/migrations/001_initial.sql
          psql "$BASE/bed4book_upgrade" -v ON_ERROR_STOP=1 -q -f tests/server/migrations/legacy_001_data.sql
          for f in server/migrations/*.sql; do
            [ "$(basename "$f")" = "001_initial.sql" ] && continue
            psql "$BASE/bed4book_upgrade" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql "$BASE/bed4book_upgrade" -v ON_ERROR_STOP=1 -f tests/server/migrations/legacy_upgrade_checks.sql
          psql "$BASE/bed4book_upgrade" -v ON_ERROR_STOP=1 -q -f tests/server/migrations/drill_v1_data.sql
      - name: Backup → restore drill (and self-test that a tampered restore fails)
        env:
          SOURCE_URL: postgres://bed4book:bed4book@localhost:5432/bed4book_upgrade
          ADMIN_URL: postgres://bed4book:bed4book@localhost:5432/bed4book_test
          RESTORE_DB: bed4book_restore_drill
        run: |
          infra/scripts/backup-restore-drill.sh
          if DRILL_TAMPER_SQL="UPDATE bookings SET total = total + 1" infra/scripts/backup-restore-drill.sh; then
            echo "Self-test failed: a tampered restore was not detected"; exit 1
          fi
          echo "Self-test passed: tampered restore detected"
      - run: npm run build:server
      - name: Compiled server smoke test (dist build, fonts bundled, /ready)
        run: |
          node -e "require('./dist-server/server/voucher').renderVoucher({bookingNo:'B4B-SMOKE',status:'approved',hotelName:'Ş',hotelLocation:'İ',checkIn:'2030-01-01',checkOut:'2030-01-02',nights:1,roomName:'R',board:'B',rooms:1,guestName:'Ğ',adults:2,children:0,childAges:[],nationality:'TR',operationNote:'n',agencyName:'a',issuedAt:new Date()}).then(b=>{if(b.subarray(0,5).toString()!=='%PDF-')process.exit(1);console.log('voucher bytes',b.length)})"
          PORT=3999 node dist-server/server/app.js & echo $! > server.pid
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3999/ready && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:3999/ready | grep -q '"database":"up"'
          kill "$(cat server.pid)"
      - run: npm run test:server
      - name: Basic performance smoke test (search p95 must stay under 500 ms)
        run: |
          BASE="postgres://bed4book:bed4book@localhost:5432"
          psql "$BASE/bed4book_test" -c "CREATE DATABASE bed4book_perf"
          for f in server/migrations/*.sql; do psql "$BASE/bed4book_perf" -v ON_ERROR_STOP=1 -q -f "$f"; done
          DATABASE_URL="$BASE/bed4book_perf" npx tsx infra/scripts/perf-smoke.ts

  # M1–M18: each mutation must turn its expected test red; files are restored and verified with git diff.
  mutation:
    runs-on: ubuntu-latest
    needs: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bed4book
          POSTGRES_PASSWORD: bed4book
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bed4book -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pdftotext (voucher content verification)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Mutation check (throwaway database, created and dropped by the script)
        env:
          ADMIN_URL: postgres://bed4book:bed4book@localhost:5432/postgres
        run: node infra/scripts/mutation-check.mjs

  # Five concurrent users (system admin, Back Office, master agency, two sub-agencies) in five browser
  # sessions, through the static web UI, against the compiled API and a throwaway PostgreSQL database.
  e2e:
    runs-on: ubuntu-latest
    needs: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bed4book
          POSTGRES_PASSWORD: bed4book
          POSTGRES_DB: bed4book_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bed4book -d bed4book_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bed4book:bed4book@localhost:5432/bed4book_e2e
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      UI_REF: ${{ github.event.inputs.ui_ref || 'feature/yeni-arayuz' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: for f in server/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Fetch the web UI from ${{ env.UI_REF }}
        run: |
          git fetch origin "$UI_REF"
          git log -1 --format='UI commit: %h %s' FETCH_HEAD
          mkdir -p /tmp/ui && git archive FETCH_HEAD web | tar -x -C /tmp/ui --strip-components=1
          echo "window.BED4BOOK_API_URL = 'http://127.0.0.1:3000';" > /tmp/ui/config.js
      - name: Install Playwright (outside the project; no lockfile change)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: npm run build:server
      - name: Start API and static UI
        run: |
          CORS_ORIGINS=http://127.0.0.1:8080 PORT=3000 node dist-server/server/app.js > /tmp/api.log 2>&1 &
          python3 -m http.server 8080 --bind 127.0.0.1 --directory /tmp/ui > /tmp/ui.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/ready && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="app"'
      - name: Five-user end-to-end test
        env:
          NODE_PATH: /tmp/pw/node_modules
          API_URL: http://127.0.0.1:3000
          UI_URL: http://127.0.0.1:8080
        run: node tests/e2e/five-users.e2e.cjs
      - name: API log (on failure)
        if: failure()
        run: tail -100 /tmp/api.log
