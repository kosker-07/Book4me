<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bed4book – B2B Rezervasyon Platformu</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%2258%22%20fill%3D%22%230B2A5B%22/%3E%3Cg%20stroke%3D%22%23fff%22%20stroke-width%3D%2210%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M70%2028%20L32%2074%20H90%22/%3E%3Cpath%20d%3D%22M70%2028%20V94%22/%3E%3C/g%3E%3Cg%20fill%3D%22%23B8862B%22%3E%3Ccircle%20cx%3D%2270%22%20cy%3D%2228%22%20r%3D%229%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2274%22%20r%3D%229%22/%3E%3Ccircle%20cx%3D%2290%22%20cy%3D%2274%22%20r%3D%229%22/%3E%3Ccircle%20cx%3D%2270%22%20cy%3D%2294%22%20r%3D%229%22/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#0B2A5B">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
:root{--bg:#f3f5f9;--sf:#fff;--tx:#0f1d33;--mu:#56627a;--ac:var(--brand-ac,#0B2A5B);--gd:var(--brand-gd,#B8862B);--on:#fff;--ln:#d7dde8;--bad:#b4381a;--ok:#2b7a4b;--warn:#a26a00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--sf:#111f36;--tx:#e7ecf5;--mu:#9aa8c0;--ac:var(--brand-gd,#D9B25A);--gd:var(--brand-gd,#D9B25A);--on:#0B2A5B;--ln:#26385c;--bad:#ff8a6b;--ok:#6fcf97;--warn:#f0c060;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1424;--sf:#111f36;--tx:#e7ecf5;--mu:#9aa8c0;--ac:var(--brand-gd,#D9B25A);--gd:var(--brand-gd,#D9B25A);--on:#0B2A5B;--ln:#26385c;--bad:#ff8a6b;--ok:#6fcf97;--warn:#f0c060;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:16px}
.lgo{display:flex;align-items:center;gap:14px;margin:4px 0 10px;flex-wrap:wrap}.lgo .wm{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1;color:#0B2A5B;margin:0}.lgo .wm b{color:#B8862B;font-weight:800}.lgo .wm .ai{font-size:14px;font-weight:700;color:#fff;background:#B8862B;border-radius:6px;padding:1px 6px;margin-inline-start:6px;vertical-align:6px;letter-spacing:0}.lgo .tg{font-size:11px;font-weight:600;letter-spacing:3.4px;color:#7A5712;margin-top:5px}
.lgo .bt{font-size:24px;font-weight:700;color:var(--ac);line-height:1.1}.lgo .bi{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ac);color:#fff;font-weight:700;font-size:24px;flex:none;overflow:hidden}.lgo .bi img{width:100%;height:100%;object-fit:contain;background:#fff}
.lgo .end{margin-inline-start:auto;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.lngw{display:flex;flex-direction:column;gap:2px;flex:none;width:auto;min-width:0;margin:0}.lngw select{width:auto;min-width:118px;padding:6px 8px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lgo .wm{color:#fff}:root:not([data-theme="light"]) .lgo .wm b,:root:not([data-theme="light"]) .lgo .tg{color:#D9B25A}}
@media(max-width:560px){.lgo .wm{font-size:26px}.lgo .url{display:none}}
[dir=rtl] th,[dir=rtl] td{text-align:right}[dir=rtl] .num{text-align:left}[dir=rtl] .lsug button{text-align:right}
h2{font-size:17px;margin:0 0 10px;font-weight:600}h3{font-size:15px;margin:0;font-weight:600}
.sub{color:var(--mu);margin:0 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;border-bottom:1px solid var(--ln)}@media(min-width:760px){.tabs{flex-wrap:wrap;overflow-x:visible}}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);padding:10px 12px;font:inherit;font-weight:500;white-space:nowrap;cursor:pointer}
.tabs button.on{color:var(--tx);border-color:var(--gd)}.tabs.sm{margin-top:-8px;font-size:14px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:12px}.box.hl{border-color:var(--ac)}.box.warn{border-color:var(--bad)}
.kpi{margin:0}.kv{font-size:22px;font-weight:650;letter-spacing:-.01em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:3px;flex:1;min-width:130px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:8px;width:100%}
input[type=color]{padding:2px;height:38px}
button.b{background:var(--ac);color:var(--on);border:0;border-radius:6px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}button.b.danger{background:var(--bad);color:#fff}
button.g{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button.lnk{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--tx);text-align:start;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.room{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--ln);align-items:center}
.mu{color:var(--mu);font-size:13px}.bad{color:var(--bad)}.ok{color:var(--ok)}.wr{color:var(--warn);font-weight:600}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:2px 10px;font-size:13px;margin:2px}.chip button{border:0;background:none;color:var(--bad);cursor:pointer;font-size:16px;padding:0}
.spb{display:inline-block;background:var(--gd);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;margin-inline-start:6px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--ln);white-space:nowrap;vertical-align:top}th{color:var(--mu);font-weight:500}.num{text-align:right}td.wrap{white-space:normal}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.grid2>.box{margin:0}.wide{grid-column:1/-1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:40;max-width:90%}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}.ovl>.box{width:min(960px,100%);margin:0}.dlg{max-width:520px}
.cal{display:flex;flex-wrap:wrap;gap:18px}.mo{flex:1;min-width:250px}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cg button{border:0;background:none;color:var(--tx);padding:10px 0;border-radius:6px;font:inherit;cursor:pointer}.cg .in{background:color-mix(in srgb,var(--ac) 18%,transparent)}.cg .sel{background:var(--ac);color:var(--on);font-weight:600}.cg button:disabled{opacity:.3;cursor:default}.cg b{font-weight:500;color:var(--mu);font-size:12px;padding:4px 0}
.log{font-size:13px;color:var(--mu);margin:8px 0 0;padding-inline-start:18px}
.rl{display:flex;flex-direction:row;align-items:center;gap:8px;color:var(--tx);font-size:14px;padding:6px 0;flex:0 0 auto;min-width:0}.rl input{width:auto}
.lsug{position:absolute;top:100%;left:0;right:0;z-index:6;background:var(--sf);border:1px solid var(--ln);border-radius:6px;max-height:280px;overflow:auto;box-shadow:0 8px 20px rgba(0,0,0,.15)}.lsug button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:8px 10px;font:inherit;font-size:14px;color:var(--tx);cursor:pointer}.lsug button:hover,.lsug button:focus{background:var(--bg)}
.pre{white-space:pre-wrap;font:inherit;font-size:14px;line-height:1.6;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:12px;max-height:420px;overflow:auto;margin:12px 0}
code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}pre.code{white-space:pre-wrap;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:8px;margin:4px 0;max-height:300px;overflow:auto}
.doc{background:#fff;color:#14262b;border-radius:8px;padding:28px;font-size:14px;line-height:1.5}.doc table{width:100%;border-collapse:collapse}.doc th,.doc td{white-space:normal;text-align:start;vertical-align:top;padding:7px 8px;border-bottom:1px solid #d5dedd}.doc th{color:#5d7075;font-weight:500}
.drop{display:block;border:2px dashed var(--ln);border-radius:12px;padding:34px 16px;text-align:center;cursor:pointer;background:var(--bg);color:var(--tx)}
.bar{height:8px;background:var(--bg);border-radius:4px;margin-top:4px}.bar>div{height:8px;background:var(--ac);border-radius:4px}
.ann{border-color:var(--gd);background:color-mix(in srgb,var(--gd) 8%,var(--sf))}
.risk-Yüksek{color:var(--bad);font-weight:600}.risk-Orta{color:var(--warn);font-weight:600}.risk-Düşük{color:var(--ok);font-weight:600}
.guide{max-width:520px;margin:0 auto}.guide .big{width:100%;padding:14px;font-size:16px}
@media print{main,#toast,.noprint{display:none!important}.ovl{position:static!important;background:none!important;padding:0!important;display:block!important;overflow:visible!important}.doc{padding:0!important}body{background:#fff!important}}
</style></head><body>
<main><header id="hdr" class="lgo"></header><div id="app"></div></main><div id="ov"></div><div id="toast" role="status" aria-live="polite"></div>
<script>/*@@APP@@*/</script>
</body></html>
