<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BED4BOOK — Back Office Faz 1</title>
<style>:root{font:15px system-ui;color:#f2f3f6;background:#0e1015}*{box-sizing:border-box}main{max-width:1100px;margin:auto;padding:24px}h1{color:#f43f50}section{background:#1b1e27;padding:20px;border:1px solid #353945;border-radius:12px;margin:18px 0}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:grid;gap:6px}input,select,button{font:inherit;padding:11px;background:#11141b;color:white;border:1px solid #555b6b;border-radius:7px}button{background:#b5122c;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#a7e9bd}.hidden{display:none}small{color:#b5b9c3}</style>
<main><h1>BED4BOOK · Back Office</h1><p>Faz 1 — Manuel ürün yükleme ve rezervasyon yönetimi</p>
<section id="login"><h2>Güvenli giriş</h2><form id="loginForm"><label>E-posta<input name="email" type="email" required></label><label>Şifre<input name="password" type="password" required></label><button>Giriş kodu gönder</button></form><form id="otpForm" class="hidden"><label>E-posta kodu<input name="code" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button>Kodu doğrula</button></form></section>
<div id="dashboard" class="hidden">
<section><h2>1 · Otel ekle</h2><form id="hotel"><label>Otel adı<input name="name" required></label><label>Konum<input name="location" required></label><label>Master acente ID (sistem yöneticisi için)<input name="ownerAgencyId"></label><button>Otel oluştur</button></form></section>
<section><h2>2 · Oda ekle</h2><form id="room"><label>Otel ID<input name="hotelId" required></label><label>Oda adı<input name="name" required></label><label>En fazla yetişkin<input name="maxAdults" type="number" min="1" max="10" value="2" required></label><label>En fazla çocuk<input name="maxChildren" type="number" min="0" max="10" value="1" required></label><button>Oda oluştur</button></form></section>
<section><h2>3 · Fiyat planı ekle</h2><form id="rate"><label>Oda ID<input name="roomId" required></label><label>Pansiyon<input name="boardName" value="BB" required></label><label>Para birimi<input name="currency" value="EUR" maxlength="3" required></label><button>Fiyat planı oluştur</button></form></section>
<section><h2>4 · Fiyat ve kontenjan takvimi</h2><form id="calendar"><label>Fiyat planı ID<input name="ratePlanId" required></label><label>Başlangıç<input name="dateFrom" type="date" required></label><label>Bitiş<input name="dateTo" type="date" required></label><label>Gecelik net fiyat<input name="price" type="number" min="0" step=".01" required></label><label>Kontenjan<input name="allotment" type="number" min="0" required></label><button>Takvimi kaydet</button></form></section>
<section><h2>5 · Acenteye ürün yayınla</h2><form id="publication"><label>Fiyat planı ID<input name="ratePlanId" required></label><label>Alt acente ID<input name="agencyId" required></label><label>Markup türü<select name="markupType"><option value="percent">Yüzde</option><option value="fixed">Sabit</option></select></label><label>Markup değeri<input name="markupValue" type="number" min="0" step=".01" value="10" required></label><button>Ürünü yayınla</button></form></section>
<section><h2>6 · Oteli satışa aç</h2><form id="activate"><label>Otel ID<input name="hotelId" required></label><button>Aktif yap</button></form></section>
<section><h2>7 · Rezervasyon operasyonu</h2><button id="refresh" type="button">Rezervasyonları getir</button><div id="bookings"></div></section>
</div><section><h2>İşlem çıktısı</h2><pre id="status" role="status">Hazır</pre></section>
</main><script>
(()=>{'use strict';let token='',challenge='';const $=id=>document.getElementById(id);const val=(form,key)=>new FormData(form).get(key);const show=x=>$('status').textContent=typeof x==='string'?x:JSON.stringify(x,null,2);
async function request(path,method='GET',body){const res=await fetch(path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await res.json();if(!res.ok)throw Error(data.error||'HTTP '+res.status);return data}
function bind(id,fn){$(id).onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{show(await fn(e.target))}catch(err){show('Hata: '+err.message)}finally{b.disabled=false}}}
bind('loginForm',async f=>{const r=await request('/api/auth/login','POST',{email:val(f,'email'),password:val(f,'password')});if(!r.requiresOtp||!r.challengeId)throw Error('OTP zorunlu');challenge=r.challengeId;$('otpForm').classList.remove('hidden');return 'Doğrulama kodu gönderildi'});
bind('otpForm',async f=>{const r=await request('/api/auth/verify-email','POST',{challengeId:challenge,code:val(f,'code')});if(!r.token||!['system_admin','back_office','master_agency'].includes(r.user?.role))throw Error('Yönetim yetkisi yok');token=r.token;challenge='';$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');return 'Yönetim oturumu açıldı'});
bind('hotel',f=>request('/api/admin/hotels','POST',{name:val(f,'name'),location:val(f,'location'),...(val(f,'ownerAgencyId')?{ownerAgencyId:val(f,'ownerAgencyId')}:{})}));
bind('room',f=>request('/api/admin/hotels/'+encodeURIComponent(val(f,'hotelId'))+'/rooms','POST',{name:val(f,'name'),maxAdults:Number(val(f,'maxAdults')),maxChildren:Number(val(f,'maxChildren'))}));
bind('rate',f=>request('/api/admin/rooms/'+encodeURIComponent(val(f,'roomId'))+'/rate-plans','POST',{boardName:val(f,'boardName'),currency:val(f,'currency').toUpperCase(),cancellationPolicy:{},paymentTerms:{},salesConditions:{}}));
bind('calendar',f=>request('/api/admin/rate-plans/'+encodeURIComponent(val(f,'ratePlanId'))+'/calendar','PUT',{dateFrom:val(f,'dateFrom'),dateTo:val(f,'dateTo'),price:Number(val(f,'price')),allotment:Number(val(f,'allotment'))}));
bind('publication',f=>request('/api/admin/publications','POST',{ratePlanId:val(f,'ratePlanId'),agencyId:val(f,'agencyId'),markupType:val(f,'markupType'),markupValue:Number(val(f,'markupValue'))}));
bind('activate',f=>request('/api/admin/hotels/'+encodeURIComponent(val(f,'hotelId')),'PATCH',{status:'active'}));
$('refresh').onclick=async()=>{try{const data=await request('/api/backoffice/bookings');const root=$('bookings');root.replaceChildren();for(const b of data.items||[]){const line=document.createElement('p');line.textContent=[b.booking_no,b.hotel_name,b.status,b.total,b.currency].join(' · ');if(b.status==='pending'){for(const status of ['approved','rejected']){const btn=document.createElement('button');btn.textContent=status==='approved'?'Onayla':'Reddet';btn.onclick=async()=>{try{show(await request('/api/backoffice/bookings/'+encodeURIComponent(b.id)+'/status','PATCH',{status}));$('refresh').click()}catch(e){show(e.message)}};line.append(' ',btn)}}root.append(line)}show(data.items?.length+' rezervasyon listelendi')}catch(e){show(e.message)}};
})();
</script></html>
